[project]
name = "disclosures"
version = "0.1.0"
description = "Multi-agent analyst assistant over Swedish listed companies: press releases, reports and insider trades, with citations and point-in-time evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "fastembed>=0.5",
    "google-cloud-storage>=3.17.1",
    "langgraph>=1.2.20",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "pypdf>=7.0.1",
    "google-cloud-bigquery>=3.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["disclosures"]

[tool.setuptools.package-data]
disclosures = ["static/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
